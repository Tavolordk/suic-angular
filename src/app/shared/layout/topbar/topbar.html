<header class="topbar">
  <div class="topbar__brand">
    <img src="/login-seguridad-logo.png" alt="Logo SSPC" />
  </div>

  <p class="topbar__title">Sistema Plataforma México</p>

  <div class="topbar__actions">
    <div class="topbar__clock" aria-label="Fecha y hora actuales">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"></circle>
        <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
          stroke-linejoin="round"></path>
      </svg>

      <div class="topbar__clock-text">
        <span>{{ currentTime() | date:'HH:mm:ss' }}</span>
        <small>{{ currentDateLabel() }}</small>
      </div>
    </div>

    <div class="topbar__profile" (click)="$event.stopPropagation()">
      <button type="button" class="topbar__profile-button"
        [attr.aria-label]="'Abrir menú de usuario de ' + accountNumber()"
        [attr.aria-expanded]="profileOpen()" (click)="toggleProfile()">
        <svg fill="none" viewBox="0 0 28 28" aria-hidden="true">
          <path
            d="M22.1667 24.875V22.5417C22.1667 21.304 21.675 20.117 20.7998 19.2418C19.9247 18.3667 18.7377 17.875 17.5 17.875H10.5C9.26232 17.875 8.07534 18.3667 7.20017 19.2418C6.325 20.117 5.83333 21.304 5.83333 22.5417V24.875"
            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
          <path
            d="M14 13.2083C16.5773 13.2083 18.6667 11.119 18.6667 8.54167C18.6667 5.96434 16.5773 3.875 14 3.875C11.4227 3.875 9.33333 5.96434 9.33333 8.54167C9.33333 11.119 11.4227 13.2083 14 13.2083Z"
            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
        </svg>
      </button>

      @if (profileOpen()) {
      <div class="topbar__profile-menu">
        <div class="topbar__profile-user">
          <div class="topbar__profile-avatar">
            <svg fill="none" viewBox="0 0 28 28" aria-hidden="true">
              <path
                d="M22.1667 24.875V22.5417C22.1667 21.304 21.675 20.117 20.7998 19.2418C19.9247 18.3667 18.7377 17.875 17.5 17.875H10.5C9.26232 17.875 8.07534 18.3667 7.20017 19.2418C6.325 20.117 5.83333 21.304 5.83333 22.5417V24.875"
                stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
              <path
                d="M14 13.2083C16.5773 13.2083 18.6667 11.119 18.6667 8.54167C18.6667 5.96434 16.5773 3.875 14 3.875C11.4227 3.875 9.33333 5.96434 9.33333 8.54167C9.33333 11.119 11.4227 13.2083 14 13.2083Z"
                stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
            </svg>
          </div>

          <div>
            <strong>{{ accountNumber() }}</strong>
            <span>{{ primaryProfile() }}</span>
          </div>
        </div>

        <div class="topbar__profile-meta">
          <p>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            Unidad de Inteligencia
          </p>

          <p>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            Perfil: {{ primaryProfile() }}
          </p>
        </div>

        <button type="button" class="topbar__logout" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          Cerrar sesión
        </button>
      </div>
      }
    </div>
  </div>
</header>
