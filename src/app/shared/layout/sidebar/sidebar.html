<aside class="sidebar">
    <nav class="sidebar__nav">
        <a routerLink="/busqueda" routerLinkActive="sidebar__item--active" class="sidebar__item">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>

        <button type="button" class="sidebar__item" title="Historial de búsquedas" aria-label="Historial de búsquedas"
            (click)="openHistory()">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </button>

        <button type="button" class="sidebar__item" title="Búsquedas guardadas" aria-label="Búsquedas guardadas"
            (click)="openSaved()">
            <i class="fa-regular fa-bookmark"></i>
        </button>

        <a routerLink="/lineas-investigacion" routerLinkActive="sidebar__item--active"
            class="sidebar__item" title="Líneas de investigación" aria-label="Líneas de investigación">
            <i class="fa-solid fa-diagram-project"></i>
        </a>

        <a routerLink="/investigaciones" routerLinkActive="sidebar__item--active"
            class="sidebar__item" title="Investigaciones" aria-label="Investigaciones">
            <i class="fa-solid fa-folder-tree"></i>
        </a>

        <a routerLink="/investigaciones" [queryParams]="{ screen: 'users' }"
            class="sidebar__item" title="Usuarios del sistema" aria-label="Usuarios del sistema">
            <i class="fa-solid fa-users"></i>
        </a>
    </nav>
</aside>
